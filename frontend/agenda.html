<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Agenda · Reserva de Salas</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/paginas/agenda.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="agenda.html">Reserva de Salas</a>
    <nav id="menu" aria-label="Menu principal"></nav>
  </header>
  <main id="conteudo" tabindex="-1">
    <div class="agenda-topo">
      <div>
        <h1>Agenda</h1>
        <p id="data-extenso"></p>
      </div>
      <form id="filtro" class="agenda-controles" aria-label="Escolher data">
        <label for="dia" class="visualmente-oculto">Data</label>
        <input id="dia" name="dia" type="date" required>
        <button type="button" id="hoje">Hoje</button>
        <a class="botao primario link-reservar" href="reservar.html">Reservar sala</a>
      </form>
    </div>

    <div id="avisos" aria-live="polite"></div>

    <div id="grade" class="agenda-rolavel" hidden>
      <div id="agenda" class="agenda"></div>
    </div>

    <ul id="legenda" class="legenda" aria-label="Legenda" hidden>
      <li><span class="amostra minha" aria-hidden="true"></span>Suas reservas</li>
      <li><span class="amostra outra" aria-hidden="true"></span>Reservas de outras pessoas</li>
      <li id="legenda-agora" hidden><span class="amostra agora" aria-hidden="true"></span><span id="texto-agora"></span></li>
    </ul>

    <div id="sem-reservas" class="agenda-sem-reservas" hidden>
      <h2>Nenhuma reserva neste dia</h2>
      <p>Todas as salas estão livres. Escolha outra data ou reserve uma sala.</p>
      <a class="botao primario link-reservar" href="reservar.html">Reservar sala</a>
    </div>

    <div id="detalhe" class="detalhe-reserva" role="region" aria-labelledby="titulo-detalhe" aria-live="polite" hidden></div>
  </main>
</body>
</html>
