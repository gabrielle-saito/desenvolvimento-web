# Reserva de Salas — ambiente de desenvolvimento
# Sobe: PostgreSQL 16 + API FastAPI com hot reload + front-end React/Vite (web).
# Uso: docker compose up --build   (migrations e seed rodam sozinhos)

services:
  db:
    image: postgres:16-alpine
    environment:
      # Valores vêm do arquivo .env na raiz (o Compose lê automaticamente).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — 5433 no host evita conflito com um PostgreSQL
      # instalado localmente (que costuma ocupar a 5432).
      - "5433:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down".
      # Para apagar tudo: docker compose down -v
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "$$" escapa o "$" para o Compose: a variável é lida DENTRO do container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Dentro da rede do Compose, o banco se chama "db" e escuta na 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Necessário para o --reload detectar mudanças em Windows/WSL2 e macOS.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      # Bind mount: o código do seu editor aparece dentro do container.
      - ./backend:/app
    depends_on:
      db:
        # Sem isto, a API sobe antes do banco aceitar conexões.
        condition: service_healthy
    # Ao subir: (1) aplica as migrations, (2) roda o seed (idempotente: não
    # duplica nada) e (3) inicia a API. Assim "docker compose up" sozinho
    # deixa o sistema pronto do zero. Se a migration falhar, a API não sobe.
    # --no-access-log: cada requisição já gera uma linha JSON "http.requisicao"
    # (com request_id e duração), feita pelo nosso middleware.
    command: >-
      sh -c "alembic upgrade head
      && python -m app.scripts.seed
      && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"

  web:
    # Front-end React (Vite) em modo de desenvolvimento, com recarga
    # automática ao salvar um arquivo.
    image: node:22-alpine
    working_dir: /app
    environment:
      # Endereço da API como o NAVEGADOR a enxerga (não o nome "api" da rede
      # do Compose: quem chama a API é o navegador, fora dos containers).
      VITE_API_URL: http://localhost:8000
      # Recarga automática em Windows/WSL2 e macOS (bind mount sem eventos).
      VITE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # node_modules fica num volume do container: não mistura com o do
      # seu computador (outro sistema operacional, outros binários).
      - web_node_modules:/app/node_modules
    ports:
      # 5173 é a origem liberada em CORS_ORIGINS no .env.
      - "5173:5173"
    # npm ci instala exatamente as versões do package-lock.json.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
